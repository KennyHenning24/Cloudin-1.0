<!doctype html>
<!--
  PLANTILLA MÍNIMA de un menú digital conectado a Cloudin.
  Copia esta carpeta (index.html) y client/example/carrito.js al repositorio del cliente.
  Guía paso a paso: PASO-A-PASO-NUEVO-RESTAURANTE.md (parte 3). Para Claude Code: CLAUDE-MENU-DIGITAL.md.

  Qué cambiar, y nada más:
    1. <servidor-cloudin>  → la dirección de tu servidor (p. ej. cloudin-abcd.onrender.com), en 2 lugares.
    2. <slug>              → el identificador del restaurante (p. ej. la-casa), en 2 lugares.
    3. apiKey              → la API key del restaurante (ck_…) si recibe pedidos por QR; si no, "".
  El diseño (CSS y HTML) es libre, siempre que conserves los atributos data-cloudin-* y
  las variables var(--cloudin-…): así TODO lo que el dueño cambia en su panel (Mi menú y
  Personalizar) se ve aquí sin volver a publicar la página.
-->
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Menú</title>
<style>
  /* Los 4 colores de Personalizar (--cloudin-*); el segundo valor, por si no eligió. */
  :root { --fondo: var(--cloudin-background, #1A1110); --texto: var(--cloudin-text, #FFF6EC);
          --primario: var(--cloudin-primary, #B3261E); --secundario: var(--cloudin-secondary, #F2C14E);
          --suave: color-mix(in srgb, var(--texto) 72%, transparent); --linea: color-mix(in srgb, var(--texto) 14%, transparent); }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--fondo); color: var(--texto); font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  a { color: inherit; }
  .envoltura { max-width: 880px; margin: 0 auto; padding: 0 16px 96px; }
  .portada { display: block; width: calc(100% + 32px); margin: 0 -16px; aspect-ratio: 2 / 1; max-height: 260px; object-fit: cover; }
  .cab { display: flex; gap: 14px; align-items: center; padding: 20px 0 16px; }
  .cab img { width: 64px; height: 64px; border-radius: 50%; object-fit: cover; }
  .cab h1 { margin: 0; font-size: 26px; line-height: 1.2; }
  .cab p { margin: 2px 0 0; color: var(--suave); }
  .bienvenida { margin: 0 0 12px; padding: 10px 14px; border: 1px solid var(--linea); border-radius: 12px; }
  .servicios { list-style: none; display: flex; gap: 6px; margin: 8px 0 0; padding: 0; }
  .servicios li { padding: 2px 10px; border: 1px solid var(--secundario); border-radius: 999px; color: var(--secundario); font-size: 13px; font-weight: 600; }
  .whatsapp { display: inline-flex; align-items: center; min-height: 44px; margin-top: 8px; padding: 0 16px; border-radius: 12px;
    background: var(--primario); color: #fff; font-weight: 700; text-decoration: none; }
  /* La barra de menús solo se ve si hay más de uno. */
  .menus-nav { display: flex; gap: 8px; overflow-x: auto; padding: 8px 0; }
  .menus-nav:not(:has(a + a)) { display: none; }
  .menus-nav a { flex: none; padding: 8px 16px; border-radius: 12px; background: var(--primario); color: #fff; text-decoration: none; font-weight: 700; }
  .menu { scroll-margin-top: 8px; padding-top: 12px; }
  .menu h2 { margin: 12px 0 0; font-size: 24px; }
  .menu > p { margin: 4px 0 0; color: var(--suave); }
  .categorias-nav { position: sticky; top: 0; z-index: 2; display: flex; gap: 8px; overflow-x: auto; padding: 10px 0;
    background: var(--fondo); border-bottom: 1px solid var(--linea); }
  .categorias-nav a { flex: none; padding: 8px 14px; border: 1px solid var(--linea); border-radius: 999px; text-decoration: none; font-weight: 600; }
  .categoria { scroll-margin-top: 64px; padding-top: 24px; }
  .categoria h3 { margin: 0; font-size: 22px; color: var(--secundario); }
  .categoria > p { margin: 4px 0 0; color: var(--suave); }
  .platos { display: grid; gap: 12px; margin-top: 12px; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); }
  .plato { display: flex; flex-direction: column; border: 1px solid var(--linea); border-radius: 16px; overflow: hidden; }
  .plato img { width: 100%; aspect-ratio: 1; object-fit: cover; }
  .dish__body { display: flex; flex-direction: column; gap: 6px; padding: 14px; }
  .dish__body h4 { margin: 0; font-size: 17px; }
  .dish__body p { margin: 0; color: var(--suave); font-size: 14px; }
  .etiquetas { list-style: none; display: flex; flex-wrap: wrap; gap: 4px; margin: 0; padding: 0; font-size: 13px; }
  .etiquetas li { padding: 0 8px; border: 1px solid var(--linea); border-radius: 999px; color: var(--suave); }
  .presentaciones { list-style: none; margin: 0; padding: 0; color: var(--suave); font-size: 14px; }
  .precio { color: var(--primario); font-size: 17px; }
  .agotado { align-self: flex-start; padding: 2px 10px; border-radius: 999px; background: var(--linea); font-size: 12px; font-weight: 700; }
  .plato[data-available="false"] { opacity: .55; }
  .cargando { color: var(--suave); }
  [data-cloudin-state="error"] .cargando::after { content: " No se pudo cargar la carta: revisa la conexión y recarga la página."; }
  .pie { margin-top: 40px; padding-top: 16px; border-top: 1px solid var(--linea); color: var(--suave); font-size: 14px; }
  .pie p { margin: 6px 0; }
  .pie a { margin-right: 10px; }
</style>
</head>
<body>
<div class="envoltura">

  <!-- DATOS DEL NEGOCIO (Personalizar): data-cloudin-field="business.…" funciona en cualquier parte
       de la página. data-cloudin-if esconde el elemento si el dato está vacío (o el servicio
       apagado) y lo vuelve a mostrar, sin recargar, si el dueño lo llena. -->
  <img class="portada" data-cloudin-if="business.cover" data-cloudin-src="business.cover" alt="">
  <header class="cab">
    <img data-cloudin-if="business.logo" data-cloudin-src="business.logo" alt="">
    <div>
      <h1 data-cloudin-field="business.name">Menú</h1>
      <p data-cloudin-if="business.tagline" data-cloudin-field="business.tagline"></p>
      <p data-cloudin-if="business.hours_today" data-cloudin-field="business.hours_today"></p>
      <ul class="servicios" aria-label="Servicios">
        <li data-cloudin-if="business.takeaway">Pide y recoge</li>
        <li data-cloudin-if="business.delivery">Domicilios</li>
      </ul>
      <a class="whatsapp" data-cloudin-if="business.whatsapp_link" data-cloudin-href="business.whatsapp_link">Escríbenos por WhatsApp</a>
    </div>
  </header>
  <p class="bienvenida" data-cloudin-if="business.welcome_message" data-cloudin-field="business.welcome_message"></p>

  <!-- MENÚS: un enlace por menú de «Mi menú» (Carta, Almuerzos, Bebidas…). -->
  <nav class="menus-nav" data-cloudin="menu-nav" aria-label="Menús">
    <template data-cloudin-template="menu-link">
      <a data-cloudin-href="menu.anchor" data-cloudin-field="menu.name"></a>
    </template>
  </nav>

  <!-- LA CARTA: data-cloudin="menus" pinta TODOS los menús, cada uno con sus categorías y sus
       platos (un menú nuevo del panel aparece solo). El runtime borra lo que haya aquí (menos
       las <template>). Solo cuenta el PRIMER elemento de cada <template>. -->
  <main data-cloudin="menus">
    <p class="cargando">Cargando la carta…</p>

    <!-- Un menú. Su raíz NO lleva data-cloudin="menu". -->
    <template data-cloudin-template="menu">
      <section class="menu">
        <h2 data-cloudin-field="menu.name"></h2>
        <p data-cloudin-if="menu.description" data-cloudin-field="menu.description"></p>
        <!-- Barra de categorías de este menú (opcional). -->
        <nav class="categorias-nav" data-cloudin="category-nav" aria-label="Categorías">
          <template data-cloudin-template="category-link">
            <a data-cloudin-href="category.anchor" data-cloudin-field="category.name"></a>
          </template>
        </nav>
        <!-- Las categorías de este menú (obligatorio). -->
        <div data-cloudin="categories"></div>
      </section>
    </template>

    <!-- Una categoría. -->
    <template data-cloudin-template="category">
      <section class="categoria">
        <h3 data-cloudin-field="category.name"></h3>
        <p data-cloudin-if="category.description" data-cloudin-field="category.description"></p>
        <!-- Los platos de esta categoría (obligatorio). -->
        <div class="platos" data-cloudin="products"></div>
      </section>
    </template>

    <!-- Un plato. El runtime le pone data-cloudin-key, data-available y data-featured. -->
    <template data-cloudin-template="product">
      <article class="plato">
        <img data-cloudin-if="product.image" data-cloudin-src="product.image" loading="lazy" width="600" height="600">
        <!-- carrito.js pone el botón «Agregar» al final de .dish__body. -->
        <div class="dish__body">
          <h4 data-cloudin-field="product.name"></h4>
          <p data-cloudin-if="product.description" data-cloudin-field="product.description"></p>
          <!-- Etiquetas: las de la lista del panel, también las que el dueño cree. -->
          <ul class="etiquetas" data-cloudin="tags">
            <template data-cloudin-template="tag"><li data-cloudin-field="tag.name"></li></template>
          </ul>
          <ul class="presentaciones" data-cloudin="variants">
            <template data-cloudin-template="variant">
              <li><span data-cloudin-field="variant.name"></span> · <span data-cloudin-field="variant.price"></span></li>
            </template>
          </ul>
          <strong class="precio" data-cloudin-field="product.price"></strong>
          <span class="agotado" data-cloudin-if="!product.available">Agotado</span>
        </div>
      </article>
    </template>
  </main>

  <footer class="pie">
    <p data-cloudin-if="business.description" data-cloudin-field="business.description"></p>
    <p><span data-cloudin-field="business.address"></span> · <span data-cloudin-field="business.city"></span>
      <a data-cloudin-if="business.maps_url" data-cloudin-href="business.maps_url">Cómo llegar</a></p>
    <p><a data-cloudin-if="business.phone_link" data-cloudin-href="business.phone_link" data-cloudin-field="business.phone"></a>
      <a data-cloudin-if="business.email_link" data-cloudin-href="business.email_link" data-cloudin-field="business.email"></a></p>
    <p><a data-cloudin-if="business.instagram" data-cloudin-href="business.instagram">Instagram</a>
      <a data-cloudin-if="business.facebook" data-cloudin-href="business.facebook">Facebook</a>
      <a data-cloudin-if="business.tiktok" data-cloudin-href="business.tiktok">TikTok</a></p>
    <p data-cloudin-if="business.payment_methods_text">Pagos: <span data-cloudin-field="business.payment_methods_text"></span></p>
  </footer>
</div>

<!-- CONFIGURACIÓN: primero esto, después los dos scripts. -->
<script>
  window.CLOUDIN_CONFIG = {
    restaurant: "<slug>",
    api: "https://<servidor-cloudin>/api/public/<slug>/menu/",
    hideSoldOut: false,
    cacheTtl: 60,
    live: 15,          // carta en vivo: cada 15 s revisa si cambió (un agotado se ve sin recargar)
    apiKey: ""
  };
</script>
<script src="https://<servidor-cloudin>/static/cloudin-menu.v1.js" defer></script>
<script src="carrito.js" defer></script>
</body>
</html>
